<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Simulation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      
      #canvas-container {
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      
      h1 {
        color: #e2e8f0;
        font-weight: 300;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: 1.5rem;
      }

      #controls {
        display: flex;
        gap: 2rem;
        padding: 1rem 1.5rem;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        backdrop-filter: blur(10px);
      }

      .control-group {
        display: flex;
        flex-direction: row;
        gap: 0.5rem;
      }

      .control-group label {
        color: #e2e8f0;
        font-size: 0.875rem;
      }

      .control-group input[type="range"] {
        width: 120px;
      }

      .control-group select,
      .control-group span {
        color: #e2e8f0;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        padding: 0.25rem 0.5rem;
        min-width: 50px;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="canvas-container">
        <h1>Weather Simulation</h1>
        <div id="controls">
          <div class="control-group">
            <label for="advection-strength">Advection Strength</label>
            <input type="range" id="advection-strength" min="0" max="20" step="0.1" value="10">
            <span id="advection-value">10</span>
          </div>
          
          <div class="control-group">
            <label for="brush-radius">Brush Radius</label>
            <input type="range" id="brush-radius" min="1" max="10" step="1" value="3">
            <span id="brush-radius-value">3</span>
          </div>

          <div class="control-group">
            <label for="visualize-vectors">Visualize Vectors</label>
            <input type="checkbox" id="visualize-vectors">
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
